services:
  - type: web
    name: riskpulse-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://riskpulse-frontend.onrender.com"]'

  - type: web
    name: riskpulse-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://riskpulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
